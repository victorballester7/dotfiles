[mgr]
show_hidden = true
linemode = "size_and_mtime"

[opener]
zathura = [
    { run = 'zathura %s >/dev/null 2>&1', desc = "Zathura", orphan = true, for = "unix" }
]
document-viewer = [
    { run = 'evince %s >/dev/null 2>&1', desc = "Document Viewer", orphan = true, for = "unix" }
]
zen = [
    { run = 'for f in %s; do zen-browser --new-tab "file://$(realpath "$f")"; done >/dev/null 2>&1', desc = "Zen Browser", orphan = true, for = "unix" }
]
open = [
    { run = 'xdg-open %s1 >/dev/null 2>&1', desc = "Open", orphan = true, for = "unix" }
]

[open]
prepend_rules = [
    { mime = "application/pdf", use = [ "zathura", "document-viewer", "zen" ] },
]

